<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b8ecff"/>
            <stop offset="100%" stop-color="#6ecff6"/>
        </linearGradient>

        <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#4dd0c8"/>
            <stop offset="100%" stop-color="#3a7bd5"/>
        </linearGradient>

        <linearGradient id="bulbGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff59d"/>
            <stop offset="100%" stop-color="#4dd0c8"/>
        </linearGradient>
    </defs>

    <!-- Cloud -->
    <path d="M150 200
           Q170 140 240 150
           Q270 100 330 130
           Q400 120 420 180
           Q470 190 450 240
           H170
           Q140 240 150 200 Z"
        fill="url(#cloudGrad)"/>

    <!-- Light bulb -->
    <circle cx="300" cy="190" r="35" fill="url(#bulbGrad)"/>
    <rect x="285" y="225" width="30" height="18" rx="5" fill="#3a7bd5"/>
    <line x1="290" y1="190" x2="310" y2="190" stroke="#ffffff" stroke-width="3"/>

    <!-- Text -->
    <text x="300" y="310"
        text-anchor="middle"
        font-size="64"
        font-family="cursive"
        fill="url(#textGrad)">
        my project
    </text>
</svg>
